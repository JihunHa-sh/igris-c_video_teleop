[workspace]
name = "igris_video_teleop_ws"
description = "IGRIS-C video teleoperation: Fast SAM 3D Body (SMPL over ZMQ, GPU PC) -> IGRIS upper-body retargeting (robot PC)."
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
# igris_c_sdk wheel ships a cpython-312 extension -> Python must be 3.12.
python = "3.12.*"
pip = ">=25.3,<26"
numpy = ">=1.26,<3"
scipy = ">=1.13,<2"
pyzmq = ">=26,<28"
pyyaml = ">=6,<7"
matplotlib = ">=3.8,<4"
pytest = ">=8,<9"

[pypi-dependencies]
igris_c_sdk = { path = "vendor/igris_c_sdk-2.1.0.post2-py3-none-any.whl" }
igris_teleop = { path = ".", editable = true }

[activation.env]
PYTHONPATH = ""
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/cyclonedds.xml"

[tasks]
teleop = "python scripts/run_teleop.py"
check-stream = "python scripts/check_stream.py"
fake-stream = "python scripts/fake_stream.py"
check-robot = "python scripts/check_robot.py"
test = "pytest -q tests"
