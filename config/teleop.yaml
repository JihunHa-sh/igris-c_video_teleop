# IGRIS-C video teleop (Fast SAM 3D Body -> IGRIS upper body).
# Every value can be overridden on the command line of scripts/run_teleop.py where noted.

stream:
  addr: tcp://172.27.190.164:5556     # Fast-SAM publisher on the GPU PC (ailab). --addr
  topic: pose
  hold_after: 0.25                    # s without a new pose -> freeze the target
  pause_after: 1.0                    # s without a new pose -> PAUSE (ENTER to re-engage)

robot:
  domain_id: 0
  namespace: igris_c_IG20
  required_control_state: [WALK_LOW]  # legs/balance stay with the walk controller

# Joints the person drives. Group names (waist, left_arm, right_arm, neck) or SDK joint names.
# Everything else gets kp=kd=0 in LowCmd (walk controller keeps the legs).
drive: [waist, left_arm, right_arm]

# Per-joint shaping, applied to the retargeted angle:  q = sign * scale * q_retarget + offset
# then clipped to [limit_min, limit_max] (defaults: SDK limits) shrunk by limit_margin.
shaping:
  Waist_Roll:  {scale: 0.5}           # people sway more than the robot should
  Waist_Pitch: {scale: 0.7}
limit_margin: 0.05                    # rad, kept away from every joint limit

gripper:                              # 1-DoF grippers (SDK ids 21 = left, 11 = right), 0 = open .. 1 = closed
  mode: hand                          # hand: make a fist = CLOSE, open your hand = OPEN | key: z / x toggle
  close_above: 0.6                    # hand_closure (0 open .. 1 fist) above this -> CLOSE
  open_below: 0.35                    # below this -> OPEN (gap = no chattering on a half-closed hand)
  hold_s: 0.15                        # the hand must stay past the threshold this long
  open_q: 0.0                         # HandCmd q sent for OPEN
  close_q: 1.0                        # HandCmd q sent for CLOSE (teleop data range 0..1)

walk:                                 # follow the person's position with the walk controller (rt/cmd_vel)
  enabled: true                       # needs root_pos / root_heading from gpu_server/run_fastsam_multiview.py
  start_on: true                      # w = toggle while running, h = reset the home spot
  deadzone_fwd_m: 0.20                # step further than this from the home spot to walk
  deadzone_side_m: 0.20
  deadzone_turn_deg: 20               # turn the hips more than this to turn the robot
  max_turn_deg: 75                    # larger = estimate not trusted -> stop
  hold_s: 0.3                         # must stay outside the dead zone this long before walking
  gain_lin: 1.0                       # (m/s) per m beyond the dead zone
  gain_yaw: 1.0                       # (rad/s) per rad beyond the dead zone
  max_vx: 0.2                         # m/s
  max_vy: 0.1
  max_wz: 0.3                         # rad/s
  acc_lin: 0.5                        # m/s^2
  acc_yaw: 1.0                        # rad/s^2
  smooth: 0.3                         # EMA on the position (1 = none)

filter:                               # One Euro filter on the retargeted angles
  min_cutoff: 1.5                     # Hz; lower = smoother, more lag
  beta: 0.4                           # higher = less lag on fast motion
  d_cutoff: 1.0

control:
  rate_hz: 50                         # retarget/target update rate
  command_hz: 300                     # LowCmd streaming rate (interpolated)
  hand_hz: 50
  engage_ramp_s: 3.0                  # blend from the robot pose to the person's pose on ENTER
  return_s: 4.0                       # back to the initial pose on quit
  max_vel:                            # rad/s (velocity limit inside the commander)
    waist: 0.8
    arm: 2.5
    wrist: 3.0
    neck: 1.5
  max_hand_vel: 3.0                   # gripper units/s (0 = open, 1 = closed)

gains: {kp: {}, kd: {}}               # overrides by joint name; defaults = igris_replay gains

safety:
  max_tracking_error: 0.8             # rad, |command - measured| -> PAUSE
  max_state_age: 0.2                  # s, LowState freshness
